<!-- Floating Action Button on the left side -->
<button class="feedback-fab" [class.hidden]="isOpen()" (click)="toggleModal()" aria-label="Provide Feedback">
  <span class="fab-icon">💬</span>
  <span class="fab-text">Feedback</span>
</button>

<!-- Feedback Modal -->
@if (isOpen()) {
  <div class="modal-overlay" (click)="toggleModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <button class="close-btn" (click)="toggleModal()">&times;</button>
      
      @if (!isSubmitted()) {
        <h2>We Value Your Feedback</h2>
        <p>How is your experience with AyurvedaDaily?</p>
        
        <div class="star-rating">
          @for (star of [1, 2, 3, 4, 5]; track star) {
            <span class="star" 
                  [class.active]="star <= rating()" 
                  (click)="setRating(star)">★</span>
          }
        </div>
        
        <div class="form-group">
          <label for="comments">What can we improve? (Optional)</label>
          <textarea 
            id="comments" 
            [(ngModel)]="comments" 
            rows="3" 
            placeholder="Tell us what you think...">
          </textarea>
        </div>
        
        <button class="btn btn-primary" (click)="submitFeedback()" [disabled]="rating() === 0">
          Submit Feedback
        </button>
      } @else {
        <div class="success-message">
          <span class="success-icon">✨</span>
          <h2>Thank You!</h2>
          <p>Your feedback helps us make AyurvedaDaily better for everyone.</p>
        </div>
      }
    </div>
  </div>
}
